<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>The Disappearing Snowman</h1>
<main>
<section id="snowman-container">
<img class="hat" src="img/hat.png" />
<img class="face nose" src="img/nose.png" />
<img class="face eyes" src="img/eyes.png" />
<img class="face mouth" src="img/mouth.png" />
<img class="scarf" src="img/scarf.png" />
<img class="hands left-hand" src="img/left-hand.png" />
<img class="hands right-hand" src="img/right-hand.png" />
<img class="body-top" src="img/body-top.png" />
<img class="body-middle" src="img/body-middle.png" />
<img class="body-bottom" src="img/body-bottom.png" />
</section>
<section id="empty-letter-container"></section>
<section id="keyboard-container">
<span class="letter">A</span>
<span class="letter">B</span>
<span class="letter">C</span>
<span class="letter">D</span>
<span class="letter">E</span>
<span class="letter">F</span>
<span class="letter">G</span>
<span class="letter">H</span>
<span class="letter">I</span>
<span class="letter">J</span>
<span class="letter">K</span>
<span class="letter">L</span>
<span class="letter">M</span>
<span class="letter">N</span>
<span class="letter">O</span>
<span class="letter">P</span>
<span class="letter">Q</span>
<span class="letter">R</span>
<span class="letter">S</span>
<span class="letter">T</span>

<span class="letter">U</span>
<span class="letter">V</span>
<span class="letter">W</span>
<span class="letter">X</span>
<span class="letter">Y</span>
<span class="letter">Z</span>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
